<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPAS Ceria – Belajar Sains Jadi Seru</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* ===== Warna (CSS variables) ===== */
:root{--bg:#f6faf7;--card:#fff;--tx:#223;--mut:#5b6670;--bd:#e3ebe6;--sh:0 4px 18px rgba(30,60,50,.08);--c1:#23875a;--c2:#2d73bf;--c3:#a86f00;--a:var(--c1);--r:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191a;--card:#1e2527;--tx:#eef3f1;--mut:#a5b2b0;--bd:#2d3739;--sh:0 4px 18px rgba(0,0,0,.3);--c1:#3fbf86;--c2:#5aa5ee;--c3:#e8b030}}
:root[data-theme="dark"]{--bg:#14191a;--card:#1e2527;--tx:#eef3f1;--mut:#a5b2b0;--bd:#2d3739;--sh:0 4px 18px rgba(0,0,0,.3);--c1:#3fbf86;--c2:#5aa5ee;--c3:#e8b030}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,sans-serif;line-height:1.6;transition:background .3s}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--card);border-bottom:1px solid var(--bd);display:flex;gap:6px;align-items:center;padding:8px 14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.15rem;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:0}
.nv,.ic{background:none;color:var(--tx);padding:10px 14px;border-radius:12px;min-height:44px;font-weight:600}
.nv:hover,.nv.on{background:var(--bd)}
main{max-width:860px;margin:0 auto;padding:24px 16px 60px;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
h1{font-size:clamp(1.7rem,5vw,2.4rem);margin:.2em 0}
h2{margin:1.6em 0 .5em;font-size:1.3rem}
p{margin:.4em 0}
.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.cb{cursor:pointer;border-top:5px solid var(--a);transition:transform .2s;text-align:left;color:var(--tx);width:100%}
.cb:hover{transform:translateY(-3px)}
.em{font-size:2rem}
.btn{background:var(--a);color:#fff;padding:12px 22px;border-radius:14px;font-weight:800;min-height:46px;margin:6px 6px 0 0;transition:filter .2s}
.btn:hover{filter:brightness(1.1)}
.btn.o{background:none;color:var(--tx);border:2px solid var(--bd)}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--a);width:0;transition:width .4s}
.fact{background:#fff6d6;color:#4a3b00;border-radius:var(--r);padding:16px}
:root[data-theme="dark"] .fact{background:#3a3315;color:#fbeeb0}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:14px;padding:13px 16px;margin:8px 0;min-height:48px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--a)}
.opt.ok{border-color:#23a05f;background:rgba(35,160,95,.15)}
.opt.no{border-color:#d9534f;background:rgba(217,83,79,.15)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1;border-radius:14px;background:var(--a);color:#fff;font-size:1.5rem;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(.8rem,3.5vw,1.2rem);padding:4px}
.mc.f{background:var(--card);color:var(--tx);border:2px solid var(--a)}
.mc.d{background:rgba(35,160,95,.2);color:var(--tx);border:2px solid #23a05f}
.chip{display:inline-block;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px 16px;margin:5px;font-weight:700;cursor:grab;color:var(--tx);min-height:44px}
.chip.sel{border-color:var(--a);box-shadow:0 0 0 3px var(--bd)}
.bk{min-height:120px;border:2px dashed var(--a);border-radius:var(--r);padding:12px;background:var(--card)}
.bk h3{margin:0 0 6px}
.shake{animation:sk .3s}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.badge{text-align:center;opacity:.35;filter:grayscale(1)}
.badge.on{opacity:1;filter:none}
.badge .em{font-size:2.6rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:700;z-index:30;animation:fade .3s}
.cf{position:fixed;top:-20px;width:10px;height:14px;z-index:40;animation:fall 2.2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="brand">🔬 IPAS Ceria</div>
  <nav id="nav"></nav>
  <button class="ic" id="tg" aria-label="Ganti mode terang atau gelap">🌓</button>
</header>
<main id="app"></main>

<script>
/* ============ DATA MATERI & SOAL (mudah diedit) ============ */
// Format soal: [pertanyaan, [pilihan...], indeks jawaban benar, penjelasan]
const CH=[
{n:1,t:"Makhluk Hidup dan Lingkungannya",e:"🌿",c:"var(--c1)",
 goals:["Menyebutkan ciri-ciri makhluk hidup","Mengelompokkan makhluk hidup","Menjelaskan rantai makanan dan adaptasi","Menjaga kelestarian lingkungan"],
 cards:[["🌱","Ciri Makhluk Hidup","Bernapas, butuh makan, tumbuh, bergerak, berkembang biak, dan peka terhadap rangsangan."],
 ["🐾","Klasifikasi","Makhluk hidup dibagi menjadi hewan, tumbuhan, dan mikroorganisme (bakteri, jamur, dll)."],
 ["🏞️","Habitat","Habitat adalah tempat hidup makhluk hidup, misalnya laut untuk ikan dan hutan untuk harimau."],
 ["🔗","Rantai Makanan","Rumput (produsen) → belalang (konsumen) → katak → ular. Pengurai menguraikan sisa makhluk hidup."],
 ["🐪","Adaptasi","Penyesuaian diri terhadap lingkungan, seperti punuk unta atau paruh burung yang berbeda-beda."],
 ["♻️","Menjaga Alam","Buang sampah pada tempatnya, tanam pohon, hemat air, dan jangan berburu hewan langka."]],
 ex:["Kucing makan ikan lalu tumbuh besar (butuh makan dan tumbuh).","Tanaman di jendela menghadap cahaya (peka rangsangan).","Daun jatuh membusuk menjadi tanah subur karena pengurai."],
 fact:"Satu sendok teh tanah subur bisa berisi lebih dari satu miliar bakteri! 🦠",
 q:[["Manakah yang termasuk ciri makhluk hidup?",["Bernapas dan tumbuh","Tidak butuh makan","Tidak bergerak sama sekali","Tidak berkembang biak"],0,"Makhluk hidup bernapas, tumbuh, makan, dan berkembang biak."],
 ["Tumbuhan membuat makanan sendiri melalui proses...",["Fotosintesis","Migrasi","Evaporasi","Hibernasi"],0,"Fotosintesis memakai cahaya matahari, air, dan karbon dioksida."],
 ["Yang berperan sebagai produsen dalam rantai makanan adalah...",["Rumput","Belalang","Katak","Elang"],0,"Produsen adalah tumbuhan hijau yang membuat makanan sendiri."],
 ["Hewan pemakan tumbuhan disebut...",["Herbivora","Karnivora","Omnivora","Dekomposer"],0,"Herbivora hanya memakan tumbuhan, contohnya sapi."],
 ["Punuk unta menyimpan lemak. Ini contoh adaptasi...",["Fisiologi/tubuh","Perilaku","Pakaian","Kebetulan"],0,"Bentuk tubuh yang membantu unta bertahan di gurun."],
 ["Habitat alami ikan paus adalah...",["Laut","Gurun","Hutan hujan","Kutub darat"],0,"Paus hidup di laut meski bernapas dengan paru-paru."],
 ["Makhluk hidup yang menguraikan sisa organisme adalah...",["Jamur dan bakteri","Singa","Elang","Rumput"],0,"Pengurai mengubah sisa makhluk hidup menjadi zat hara."],
 ["Mikroorganisme hanya bisa dilihat dengan...",["Mikroskop","Mata telanjang","Teleskop","Kaca spion"],0,"Ukurannya sangat kecil sehingga perlu mikroskop."],
 ["Cara menjaga lingkungan yang benar adalah...",["Membuang sampah pada tempatnya","Menebang hutan sembarangan","Membakar sampah plastik","Memburu hewan langka"],0,"Sampah yang dibuang pada tempatnya menjaga alam bersih."],
 ["Lebah mengisap nektar dan membantu penyerbukan bunga. Hubungan ini...",["Saling menguntungkan","Saling merugikan","Hanya merugikan bunga","Tidak ada hubungan"],0,"Lebah dapat makanan, bunga terbantu penyerbukan."]]},
{n:2,t:"Zat dan Perubahannya",e:"🧪",c:"var(--c2)",
 goals:["Membedakan padat, cair, dan gas","Menjelaskan perubahan wujud","Membedakan perubahan fisika dan kimia","Mengenal campuran dan larutan"],
 cards:[["🧊","Wujud Zat","Padat (bentuk tetap), cair (mengikuti wadah), dan gas (memenuhi ruang)."],
 ["🔍","Sifat Zat","Zat punya massa, menempati ruang, dan bisa dikenali dari warna, bau, dan kekerasan."],
 ["🔄","Perubahan Wujud","Mencair, membeku, menguap, mengembun, menyublim (padat → gas), dan mendeposisi."],
 ["✂️","Perubahan Fisika","Zat berubah bentuk tetapi jenisnya sama, misalnya es mencair atau kertas digunting."],
 ["🔥","Perubahan Kimia","Terbentuk zat baru, misalnya kayu terbakar, besi berkarat, atau makanan basi."],
 ["🥤","Campuran & Larutan","Campuran bisa dipisahkan. Larutan tercampur merata, seperti gula dalam air."]],
 ex:["Es batu di gelas mencair saat siang hari.","Embun di pagi hari adalah uap air yang mengembun.","Telur digoreng tidak bisa kembali seperti semula (perubahan kimia)."],
 fact:"Kapur barus bisa langsung menjadi gas tanpa mencair lebih dulu. Itu disebut menyublim! 💨",
 q:[["Zat cair memiliki sifat...",["Bentuk mengikuti wadah","Bentuk selalu tetap","Mengisi seluruh ruang","Tidak bermassa"],0,"Zat cair berubah bentuk sesuai wadahnya."],
 ["Es berubah menjadi air disebut...",["Mencair","Membeku","Menguap","Menyublim"],0,"Padat menjadi cair karena menerima panas."],
 ["Air berubah menjadi uap disebut...",["Menguap","Mengembun","Membeku","Mencair"],0,"Cair menjadi gas karena dipanaskan."],
 ["Mengembun adalah perubahan dari...",["Gas menjadi cair","Cair menjadi padat","Padat menjadi gas","Padat menjadi cair"],0,"Contohnya titik air di luar gelas es."],
 ["Kapur barus yang mengecil lama-lama mengalami...",["Menyublim","Mengembun","Membeku","Berkarat"],0,"Padat langsung menjadi gas."],
 ["Contoh perubahan kimia adalah...",["Kayu terbakar","Es mencair","Kertas digunting","Gula larut"],0,"Kayu terbakar menghasilkan abu dan asap (zat baru)."],
 ["Contoh perubahan fisika adalah...",["Air membeku jadi es","Besi berkarat","Nasi menjadi basi","Petasan meledak"],0,"Jenis zatnya tetap air."],
 ["Yang termasuk larutan adalah...",["Gula dalam air","Pasir dalam air","Minyak dalam air","Kerikil dan tanah"],0,"Gula larut merata dan tidak terlihat butirannya."],
 ["Ciri utama gas adalah...",["Memenuhi ruang yang ditempati","Bentuk dan volume tetap","Tidak dapat dihirup","Selalu terlihat"],0,"Gas menyebar mengisi seluruh wadah."],
 ["Air dan pasir yang diaduk merupakan...",["Campuran","Larutan","Zat tunggal","Gas"],0,"Pasir tidak larut sehingga bisa disaring."]]},
{n:3,t:"Energi dan Perubahannya",e:"⚡",c:"var(--c3)",
 goals:["Menyebutkan bentuk-bentuk energi","Menjelaskan perubahan bentuk energi","Membedakan sumber energi","Menerapkan hemat energi"],
 cards:[["🔥","Bentuk Energi","Energi panas, cahaya, bunyi, listrik, dan gerak (kinetik)."],
 ["🔁","Perubahan Energi","Energi tidak bisa dibuat atau dimusnahkan, hanya berubah bentuk."],
 ["☀️","Terbarukan","Tidak habis: matahari, angin, air, dan panas bumi."],
 ["🛢️","Tidak Terbarukan","Bisa habis: minyak bumi, batu bara, dan gas alam."],
 ["💡","Cahaya & Bunyi","Cahaya merambat lurus. Bunyi berasal dari benda yang bergetar."],
 ["🔌","Hemat Energi","Matikan lampu dan alat listrik yang tidak dipakai, cabut charger, pakai lampu LED."]],
 ex:["Kipas angin: energi listrik menjadi energi gerak.","Panel surya: energi cahaya menjadi energi listrik.","Baterai senter: energi kimia → listrik → cahaya."],
 fact:"Cahaya matahari butuh sekitar 8 menit untuk sampai ke Bumi! 🌍",
 q:[["Energi tidak dapat...",["Dimusnahkan","Berubah bentuk","Dipindahkan","Dimanfaatkan"],0,"Energi hanya berubah bentuk (hukum kekekalan energi)."],
 ["Setrika listrik mengubah energi listrik menjadi...",["Panas","Bunyi","Gerak","Kimia"],0,"Setrika dipakai karena menghasilkan panas."],
 ["Sumber energi terbarukan adalah...",["Matahari","Minyak bumi","Batu bara","Gas alam"],0,"Matahari tidak akan habis dalam waktu dekat."],
 ["Sumber energi yang tidak terbarukan adalah...",["Minyak bumi","Angin","Air terjun","Matahari"],0,"Terbentuk jutaan tahun sehingga bisa habis."],
 ["Cahaya merambat dengan arah...",["Lurus","Berkelok","Melingkar","Zigzag"],0,"Karena itu bayangan terbentuk di belakang benda."],
 ["Bunyi dihasilkan oleh benda yang...",["Bergetar","Diam","Panas","Berat"],0,"Getaran menjalar lewat udara ke telinga kita."],
 ["Panel surya mengubah cahaya matahari menjadi...",["Energi listrik","Energi bunyi","Energi gerak","Energi kimia"],0,"Dipakai untuk menyalakan lampu dan alat listrik."],
 ["Contoh hemat energi adalah...",["Mematikan lampu saat tidak dipakai","Membiarkan TV menyala","Membuka kulkas lama-lama","Menyalakan AC terus"],0,"Mengurangi pemborosan menghemat uang dan alam."],
 ["Sepeda yang melaju memiliki energi...",["Gerak","Bunyi","Cahaya","Nuklir"],0,"Benda bergerak memiliki energi kinetik."],
 ["Baterai menyimpan energi dalam bentuk...",["Kimia","Bunyi","Gerak","Cahaya"],0,"Energi kimia diubah menjadi listrik saat dipakai."]]}
];
// Game Klasifikasi: [nama, [kelompok A, B, (C)], [[item, indeks kelompok]...]]
const CLS=[["Hewan / Tumbuhan",["Hewan","Tumbuhan"],[["Kucing",0],["Mawar",1],["Ikan",0],["Padi",1],["Burung",0],["Jagung",1]]],
["Padat / Cair / Gas",["Padat","Cair","Gas"],[["Batu",0],["Susu",1],["Udara",2],["Kayu",0],["Minyak",1],["Uap air",2]]],
["Energi",["Terbarukan","Tak terbarukan"],[["Matahari",0],["Angin",0],["Batu bara",1],["Minyak bumi",1],["Air terjun",0],["Gas alam",1]]]];
// Memory: [emoji, istilah]
const MEM=[["🌱","Produsen"],["🐄","Herbivora"],["💧","Cair"],["🔥","Panas"],["☀️","Terbarukan"],["🍄","Pengurai"]];
// Tebak Cepat: [pernyataan, benar?]
const TF=[["Tumbuhan membuat makanan sendiri",1],["Es mencair adalah perubahan kimia",0],["Matahari adalah energi terbarukan",1],["Gas memiliki bentuk tetap",0],["Bunyi berasal dari getaran",1],["Jamur termasuk pengurai",1],["Minyak bumi tidak akan habis",0],["Embun terbentuk dari uap air yang mengembun",1],["Cahaya merambat zig-zag",0],["Kayu terbakar menghasilkan zat baru",1],["Ikan paus hidup di gurun",0],["Kipas angin mengubah listrik menjadi gerak",1],["Gula dalam air membentuk larutan",1],["Kucing termasuk tumbuhan",0],["Mematikan lampu itu hemat energi",1],["Air membeku menjadi gas",0]];
const BADGES=[["🌱","Penjelajah Alam","Selesaikan quiz Bab 1",s=>s.best[0]!=null],["🧪","Ilmuwan Cilik","Selesaikan quiz Bab 2",s=>s.best[1]!=null],["⚡","Pakar Energi","Selesaikan quiz Bab 3",s=>s.best[2]!=null],["🏆","Skor Sempurna","Dapat nilai 10/10",s=>Object.values(s.best).some(v=>v==10)],["🎮","Gamer Sains","Mainkan 3 game",s=>Object.keys(s.games).length>=3],["🚀","Juara Cepat","Skor ≥ 10 di Tebak Cepat",s=>s.fast>=10]];

/* ============ STATE (di memori, tanpa localStorage) ============ */
const S={read:{},best:{},games:{},fast:0};
let view="home",arg=0,timer=null;
const $=s=>document.querySelector(s);
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
const app=$("#app");

/* ============ UTILITAS ============ */
function go(v,a=0){clearInterval(timer);view=v;arg=a;render();scrollTo(0,0)}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.append(d);setTimeout(()=>d.remove(),2600)}
function confetti(){for(let i=0;i<50;i++){const d=document.createElement("i");d.className="cf";d.style.left=Math.random()*100+"vw";d.style.background=["#3fbf86","#5aa5ee","#e8b030","#f27d9c"][i%4];d.style.animationDelay=Math.random()*.6+"s";document.body.append(d);setTimeout(()=>d.remove(),3000)}}
function earned(){return BADGES.filter(b=>b[3](S)).map(b=>b[1])}
function award(fn){const b=earned();fn();earned().filter(x=>!b.includes(x)).forEach(x=>toast("🎖️ Lencana baru: "+x))}
function progress(){let p=0;for(let i=0;i<3;i++){if(S.read[i])p++;if(S.best[i]!=null)p++}return Math.round(p/6*100)}
function setNav(){$("#nav").innerHTML=[["home","Beranda"],["games","Game"],["score","Pencapaian"]].map(([v,t])=>`<button class="nv ${view===v?"on":""}" onclick="go('${v}')">${t}</button>`).join("")}

/* ============ TAMPILAN ============ */
function render(){setNav();({home,chapter,quiz,games,score}[view])()}

function home(){
 app.innerHTML=`<h1>Belajar IPAS jadi seru! 🌟</h1><p class="mut">Pelajari alam, zat, dan energi lewat materi singkat, quiz, dan game.</p>
 <div class="card" style="margin:18px 0"><b>Progres belajarmu: ${progress()}%</b><div class="bar" style="margin-top:8px"><i style="width:${progress()}%"></i></div></div>
 <div class="grid">${CH.map((c,i)=>`<button class="card cb" style="--a:${c.c}" onclick="go('chapter',${i})"><div class="em">${c.e}</div><h3 style="margin:.3em 0">Bab ${c.n}</h3><p>${c.t}</p><p class="mut">${S.best[i]!=null?"Skor terbaik: "+S.best[i]+"/10":"Belum ada quiz"}</p></button>`).join("")}</div>
 <p><button class="btn" onclick="go('games')">🎮 Main Game</button></p>`}

function chapter(){
 const c=CH[arg];S.read[arg]=1;
 app.style.setProperty("--a",c.c);
 app.innerHTML=`<div style="--a:${c.c}"><div class="em">${c.e}</div><h1>Bab ${c.n}: ${c.t}</h1>
 <h2>🎯 Tujuan Pembelajaran</h2><div class="card"><ul style="margin:0;padding-left:20px">${c.goals.map(g=>`<li>${g}</li>`).join("")}</ul></div>
 <h2>📖 Materi</h2><div class="grid">${c.cards.map(k=>`<div class="card"><div class="em">${k[0]}</div><b>${k[1]}</b><p class="mut">${k[2]}</p></div>`).join("")}</div>
 <h2>🏠 Contoh Sehari-hari</h2><div class="card">${c.ex.map(x=>`<p>• ${x}</p>`).join("")}</div>
 <h2>💡 Tahukah Kamu?</h2><div class="fact">${c.fact}</div>
 <p style="margin-top:24px"><button class="btn" onclick="startQuiz(${arg})">📝 Mulai Quiz</button></p>
 <p>${arg>0?`<button class="btn o" onclick="go('chapter',${arg-1})">← Bab sebelumnya</button>`:""}${arg<2?`<button class="btn o" onclick="go('chapter',${arg+1})">Bab berikutnya →</button>`:""}</p></div>`}

/* ---- Quiz ---- */
let Q={};
function startQuiz(i){Q={ch:i,l:sh(CH[i].q).map(q=>({q:q[0],o:sh(q[1].map((t,k)=>[t,k===q[2]])),e:q[3]})),i:0,s:0};go("quiz",i)}
function quiz(){
 const c=CH[Q.ch];app.style.setProperty("--a",c.c);
 if(Q.i>=10){
  const s=Q.s;award(()=>{if(S.best[Q.ch]==null||s>S.best[Q.ch])S.best[Q.ch]=s});
  if(s==10)confetti();
  const m=s==10?"Sempurna! Kamu hebat sekali! 🎉":s>=7?"Bagus! Sedikit lagi sempurna 💪":s>=5?"Lumayan! Baca materi lagi ya 📖":"Jangan menyerah, ayo coba lagi! 🌱";
  app.innerHTML=`<div style="--a:${c.c};text-align:center"><div class="em" style="font-size:3.5rem">${s==10?"🏆":"⭐"}</div><h1>Skor: ${s}/10</h1><p>${m}</p><button class="btn" onclick="startQuiz(${Q.ch})">🔁 Ulangi Quiz</button><button class="btn o" onclick="go('chapter',${Q.ch})">Kembali ke materi</button></div>`;return}
 const q=Q.l[Q.i];
 app.innerHTML=`<div style="--a:${c.c}"><p class="mut">Bab ${c.n} • Soal ${Q.i+1} dari 10</p><div class="bar"><i style="width:${Q.i*10}%"></i></div>
 <h2>${q.q}</h2>${q.o.map((o,k)=>`<button class="opt" onclick="ans(${k})">${o[0]}</button>`).join("")}<div id="fb"></div></div>`}
function ans(k){
 const q=Q.l[Q.i],b=[...document.querySelectorAll(".opt")];
 b.forEach((x,j)=>{x.disabled=true;if(q.o[j][1])x.classList.add("ok")});
 if(q.o[k][1])Q.s++;else b[k].classList.add("no");
 $("#fb").innerHTML=`<div class="card" style="margin-top:12px"><b>${q.o[k][1]?"✅ Benar!":"❌ Belum tepat."}</b><p>${q.e}</p><button class="btn" onclick="Q.i++;quiz()">${Q.i==9?"Lihat skor":"Lanjut →"}</button></div>`}

/* ---- Game ---- */
let G="mem",cs=0;
function games(){
 app.style.setProperty("--a","var(--c2)");
 app.innerHTML=`<h1>🎮 Game</h1><div class="tabs">${[["mem","🃏 Memory"],["cls","🧩 Klasifikasi"],["tf","⚡ Tebak Cepat"]].map(([k,t])=>`<button class="btn ${G===k?"":"o"}" onclick="G='${k}';games()">${t}</button>`).join("")}</div><div id="gm"></div>`;
 ({mem:memory,cls:classify,tf:fast}[G])()}
function played(k){award(()=>{S.games[k]=1})}

function memory(){
 let cards=sh(MEM.flatMap((m,i)=>[{k:i,t:m[0]},{k:i,t:m[1]}])),open=[],done=0,mv=0,lock=false;
 const el=$("#gm");
 const draw=()=>{el.innerHTML=`<p class="mut">Cocokkan gambar dengan istilahnya. Langkah: ${mv}</p><div class="mem">${cards.map((c,i)=>`<button class="mc ${c.d?"d":open.includes(i)?"f":""}" onclick="flip(${i})" aria-label="kartu ${i+1}">${c.d||open.includes(i)?c.t:"?"}</button>`).join("")}</div>`};
 window.flip=i=>{if(lock||cards[i].d||open.includes(i))return;open.push(i);draw();
  if(open.length==2){mv++;const[a,b]=open;
   if(cards[a].k==cards[b].k){cards[a].d=cards[b].d=1;open=[];done++;draw();if(done==6){played("mem");confetti();toast("Hebat! Selesai dalam "+mv+" langkah 🎉")}}
   else{lock=true;setTimeout(()=>{open=[];lock=false;draw()},800)}}};
 draw()}

function classify(){
 const set=CLS[cs],el=$("#gm");let items=sh(set[2]),sel=null,left=items.length;
 const draw=()=>{el.innerHTML=`<div class="tabs">${CLS.map((c,i)=>`<button class="btn ${i==cs?"":"o"}" onclick="cs=${i};classify()">${c[0]}</button>`).join("")}</div>
 <p class="mut">Seret kartu ke kelompok yang benar (di HP: ketuk kartu, lalu ketuk kelompoknya).</p>
 <div id="pool">${items.map(it=>`<span class="chip" draggable="true" data-k="${it[1]}" data-n="${it[0]}">${it[0]}</span>`).join("")}</div>
 <div class="grid" style="margin-top:14px">${set[1].map((n,i)=>`<div class="bk" data-b="${i}"><h3>${n}</h3></div>`).join("")}</div>`;
  const place=(chip,b)=>{if(+chip.dataset.k===+b.dataset.b){chip.draggable=false;chip.style.cursor="default";b.append(chip);sel=null;chip.classList.remove("sel");
    if(--left==0){played("cls");confetti();toast("Semua benar! 🎉")}}
   else{chip.classList.add("shake");setTimeout(()=>chip.classList.remove("shake"),300)}};
  document.querySelectorAll(".chip").forEach(ch=>{
   ch.ondragstart=e=>e.dataTransfer.setData("t",ch.dataset.n);
   ch.onclick=()=>{if(!ch.draggable)return;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("sel"));sel=ch;ch.classList.add("sel")}});
  document.querySelectorAll(".bk").forEach(b=>{
   b.ondragover=e=>e.preventDefault();
   b.ondrop=e=>{e.preventDefault();const n=e.dataTransfer.getData("t"),ch=[...document.querySelectorAll(".chip")].find(x=>x.dataset.n===n);if(ch&&ch.draggable)place(ch,b)};
   b.onclick=()=>{if(sel)place(sel,b)}})};
 draw()}

function fast(){
 const el=$("#gm");let l=sh(TF),i=0,s=0,t=60;
 el.innerHTML=`<div class="card"><p>Benar atau salah? Jawab sebanyak mungkin dalam 60 detik!</p><button class="btn" id="go">Mulai</button></div>`;
 $("#go").onclick=()=>{
  const draw=()=>{if(i>=l.length){l=sh(TF);i=0}el.innerHTML=`<div class="card"><p class="mut">⏱️ <b id="tm">${t}</b> detik • Skor: <b>${s}</b></p><h2 style="margin-top:0">${l[i][0]}</h2><button class="btn" onclick="tfa(1)">✅ Benar</button><button class="btn" style="background:#c9494a" onclick="tfa(0)">❌ Salah</button></div>`};
  window.tfa=v=>{if(l[i][1]==v)s++;else s=Math.max(0,s-1);i++;draw()};
  draw();
  timer=setInterval(()=>{t--;const e=$("#tm");if(e)e.textContent=t;
   if(t<=0){clearInterval(timer);award(()=>{S.games.tf=1;S.fast=Math.max(S.fast,s)});if(s>=10)confetti();
    el.innerHTML=`<div class="card" style="text-align:center"><div class="em">⏰</div><h2>Waktu habis! Skor: ${s}</h2><p>Rekor terbaikmu: ${S.fast}</p><button class="btn" onclick="fast()">Main lagi</button></div>`}},1000)}}

/* ---- Pencapaian ---- */
function score(){
 app.style.setProperty("--a","var(--c1)");
 app.innerHTML=`<h1>🏅 Pencapaian</h1><div class="card"><b>Progres: ${progress()}%</b><div class="bar" style="margin-top:8px"><i style="width:${progress()}%"></i></div></div>
 <h2>Skor Quiz</h2><div class="grid">${CH.map((c,i)=>`<div class="card"><div class="em">${c.e}</div><b>Bab ${c.n}</b><p class="mut">${S.best[i]!=null?S.best[i]+"/10":"Belum dikerjakan"}</p></div>`).join("")}</div>
 <h2>Lencana</h2><div class="grid">${BADGES.map(b=>`<div class="card badge ${b[3](S)?"on":""}"><div class="em">${b[0]}</div><b>${b[1]}</b><p class="mut">${b[2]}</p></div>`).join("")}</div>`}

/* ---- Tema ---- */
$("#tg").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
render();
</script>
